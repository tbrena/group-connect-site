# Roda o bot de ofertas (scripts/ofertas) e commita public/ofertas.json.
# O Lovable sincroniza a main e publica o site sozinho.
#
# - A cada hora (schedule): busca ofertas, posta no Telegram (se configurado) e atualiza o site.
# - Sob demanda (workflow_dispatch): pelo botão "Puxar novas ofertas" em /promo (que abre
#   esta página no GitHub) ou pela aba Actions. Só quem tem acesso ao repositório dispara,
#   então por padrão também posta no Telegram; desmarque a opção para atualizar só o site.
#
# Segredos necessários (Settings → Secrets and variables → Actions):
#   ML_CLIENT_ID, ML_CLIENT_SECRET, ML_AFFILIATE_WORD, ML_AFFILIATE_TOOL
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID (opcionais; sem eles roda só o site)
#   SHOPEE_APP_ID, SHOPEE_SECRET (opcionais; sem eles as buscas da Shopee são puladas)
name: Ofertas

on:
  schedule:
    # Dois horários por hora porque o agendador do GitHub é "melhor esforço": em pico ele
    # atrasa ou descarta execuções. Se um cair, o outro cobre; se os dois rodarem, o bot só
    # posta no Telegram quando a última postagem foi há mais de 45 min (o resto atualiza o site).
    # Minutos fora do 0, que é o mais disputado.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      telegram:
        # Só quem tem acesso ao repositório consegue disparar (o botão do site abre esta
        # página do GitHub), então não há risco de visitante lotar o canal: padrão ligado.
        description: "Publicar também no Telegram"
        type: boolean
        default: true

# Uma execução por vez; a próxima espera na fila em vez de rodar em paralelo.
concurrency:
  group: ofertas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  ofertas:
    runs-on: ubuntu-latest
    # Uma API travada não pode segurar a fila por horas.
    timeout-minutes: 20
    env:
      # true quando o segredo existe (o contexto secrets não pode ir direto num `if`)
      TEM_DADOS: ${{ secrets.DADOS_DEPLOY_KEY != '' }}
    steps:
      # ref: main (e não o commit do disparo): quem esperou na fila do `concurrency` precisa
      # partir do que a execução anterior acabou de commitar, senão o push final conflita e
      # o registro do que foi postado se perde.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Só o bot tem dependências (sharp, para a imagem com marca); o site não é instalado.
      - name: Instalar dependências do bot
        run: npm ci --prefix scripts/ofertas

      # Node só apaga os tipos: um erro de tipo viraria crash silencioso na rodada.
      - name: Checar tipos do bot
        run: npm exec --prefix scripts/ofertas -- tsc -p scripts/ofertas/tsconfig.json

      - name: Buscar ofertas
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_AFFILIATE_WORD: ${{ secrets.ML_AFFILIATE_WORD }}
          ML_AFFILIATE_TOOL: ${{ secrets.ML_AFFILIATE_TOOL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHOPEE_APP_ID: ${{ secrets.SHOPEE_APP_ID }}
          SHOPEE_SECRET: ${{ secrets.SHOPEE_SECRET }}
          COM_TELEGRAM: ${{ github.event_name == 'schedule' || inputs.telegram == true }}
        run: |
          if [ -z "$ML_CLIENT_ID" ]; then
            echo "::warning::Segredos do Mercado Livre não configurados — nada a fazer."
            exit 0
          fi
          if [ "$COM_TELEGRAM" = "true" ] && [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            # Disparo manual sempre posta; o agendado respeita o intervalo mínimo entre posts
            # (dois horários por hora podem rodar ambos).
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              npm run ofertas -- --forcar
            else
              npm run ofertas
            fi
          else
            npm run ofertas -- --so-site
          fi

      # O site publicado lê o ofertas.json do repositório público tbrena/preco-ninja-dados
      # (o repo do código é privado e o Lovable só republica o site quando o código muda).
      - name: Publicar ofertas.json no repositório de dados
        if: env.TEM_DADOS == 'true'
        env:
          DADOS_DEPLOY_KEY: ${{ secrets.DADOS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DADOS_DEPLOY_KEY" > ~/.ssh/dados
          chmod 600 ~/.ssh/dados
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/dados -o IdentitiesOnly=yes"
          git clone -q --depth 1 git@github.com:tbrena/preco-ninja-dados.git /tmp/dados
          cp public/ofertas.json /tmp/dados/ofertas.json
          [ -f public/links.json ] && cp public/links.json /tmp/dados/links.json || true
          [ -f public/cupons.json ] && cp public/cupons.json /tmp/dados/cupons.json || true
          [ -f public/whatsapp.json ] && cp public/whatsapp.json /tmp/dados/whatsapp.json || true
          cd /tmp/dados
          git config user.name "preco-ninja-bot"
          git config user.email "bot@ofertaninja.online"
          git add ofertas.json
          [ -f links.json ] && git add links.json || true
          [ -f cupons.json ] && git add cupons.json || true
          [ -f whatsapp.json ] && git add whatsapp.json || true
          if git diff --cached --quiet; then echo "Sem mudanças no site."; exit 0; fi
          git commit -q -m "ofertas: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push -q

      # `if: always()`: mesmo que a busca ou o push de dados falhe DEPOIS de postar no
      # Telegram, o publicadas.json precisa ser salvo — senão a próxima rodada reposta tudo.
      - name: Publicar no site (commit)
        if: always()
        run: |
          git config user.name "preco-ninja-bot"
          git config user.email "bot@ofertaninja.online"
          # Tudo que o bot grava e é versionado; o .gitignore deixa de fora token e chaves.
          git add public/ofertas.json public/links.json public/cupons.json public/whatsapp.json .ofertas/
          if git diff --cached --quiet; then
            echo "Nenhuma oferta nova."
            exit 0
          fi
          git commit -q -m "ofertas: atualização automática $(date -u +'%Y-%m-%d %H:%M UTC')"
          # --autostash: uma sobra no working tree (foi o links.json) não pode derrubar a rodada
          git pull --rebase --autostash origin main
          git push
